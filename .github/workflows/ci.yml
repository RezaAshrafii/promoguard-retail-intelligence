name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Build-system requirements are installed in an isolated environment and do
      # not upgrade the runner's own packages. Upgrade both tools here so the
      # subsequent pip-audit checks the same safe environment used by CI.
      - run: python -m pip install --upgrade "pip>=26.2.1" "setuptools>=83"
      - run: python -m pip install -e ".[dev,dashboard]"
      - run: ruff check .
      - run: pytest --cov=promoguard --cov=apps --cov-fail-under=70 -q
      - run: python -m compileall -q src apps demo
      - run: python -m pip check
      - run: python -m bandit -r src apps -q
      - run: python -m pip_audit --progress-spinner off
      - run: python -m pip wheel --no-deps . --wheel-dir dist

