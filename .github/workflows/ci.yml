name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      # Build-system requirements are installed in an isolated environment and do
      # not upgrade the runner's own packages. Upgrade both tools here so the
      # subsequent pip-audit checks the same safe environment used by CI.
      - run: python -m pip install --upgrade "pip>=26.2.1" "setuptools>=83"
      - run: python -m pip install -e ".[dev,dashboard]"
      - run: ruff check .
      - run: pytest --cov=promoguard --cov=apps --cov-fail-under=70 -q
      - run: python -m compileall -q src apps demo
      - run: python -m pip check
      - run: python -m bandit -r src apps -q
      - run: python -m pip_audit --progress-spinner off
      - run: python -m pip wheel --no-deps . --wheel-dir dist

