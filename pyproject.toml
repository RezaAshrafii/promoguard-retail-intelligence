[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "promoguard-ai"
version = "0.5.2"
description = "Evidence-aware retail promotion auditing and experiment prioritization"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pandas>=2.2,<3",
  "pydantic>=2.8,<3",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.37,<2"]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<6",
  "ruff>=0.6,<1",
]

[project.scripts]
promoguard = "promoguard.cli:main"

[project.urls]
Repository = "https://github.com/RezaAshrafii/promoguard-retail-intelligence"
Issues = "https://github.com/RezaAshrafii/promoguard-retail-intelligence/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
